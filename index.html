<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Avanti Ministrare • Kasse</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="preload" as="image" href="gluehwein.png" />
        <link rel="preload" as="image" href="gluehwein-schuss.png" />
        <link rel="preload" as="image" href="kakao.png" />
        <link rel="preload" as="image" href="kakao-schuss.png" />
        <link rel="preload" as="image" href="kinderpunsch.png" />
        <link rel="preload" as="image" href="pfand.png" />

        <style>
            :root {
                --surface-app: #f4f6f8;
                --surface-card: #ffffff;
                --surface-muted: #eef2f6;
                --ink-primary: #0f172a;
                --ink-secondary: #475569;
                --ink-muted: #64748b;
                --line-subtle: #e2e8f0;
                --line-strong: #cbd5e1;
                --accent-brand: #1e293b;
                --accent-action: #15803d;
                --accent-action-hover: #166534;
                --accent-action-soft: #f0fdf4;
                --accent-danger: #dc2626;
                --accent-danger-soft: #fef2f2;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 0 0 144px 0;
                font-family: "Inter", sans-serif;
                background-color: var(--surface-app);
                color: var(--ink-primary);
                font-variant-numeric: tabular-nums;
                -webkit-tap-highlight-color: transparent;
            }

            button {
                font-family: inherit;
            }

            /* TOP-BAR */
            .topbar {
                background-color: var(--accent-brand);
                color: #ffffff;
                padding: 12px 16px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .topbar-brand {
                display: flex;
                align-items: center;
                gap: 11px;
            }

            .logo {
                width: 38px;
                height: 38px;
                border-radius: 8px;
                object-fit: cover;
                background-color: #ffffff;
                border: 1px solid rgba(255, 255, 255, 0.25);
            }

            .topbar-titles {
                display: flex;
                flex-direction: column;
            }

            .topbar-title {
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 16px;
                font-weight: 800;
                letter-spacing: -0.01em;
                line-height: 1.15;
            }

            .topbar-meta {
                font-size: 12px;
                color: #cbd5e1;
                margin-top: 2px;
            }

            .topbar-pill {
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: #e2e8f0;
                background-color: rgba(255, 255, 255, 0.1);
                padding: 5px 9px;
                border-radius: 6px;
            }

            /* LAYOUT */
            .pos-shell {
                max-width: 1260px;
                margin: 0 auto;
                padding: 14px 12px 0;
            }

            .section-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 10px;
            }

            .section-title {
                margin: 0;
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 15px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--ink-secondary);
            }

            .section-sub {
                font-size: 12px;
                color: var(--ink-muted);
            }

            /* PRODUKT-LISTE (SMARTPHONE: KOMPAKTE KARTEN) */
            .produkte {
                display: grid;
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .produkt-container {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 6px;
                align-items: stretch;
            }

            .produkt {
                width: 100%;
                background-color: var(--surface-card);
                border: 1px solid var(--line-subtle);
                border-radius: 10px;
                padding: 10px 14px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                text-align: left;
                cursor: pointer;
                transition: border-color 0.12s ease, background-color 0.12s ease, transform 0.06s ease;
            }

            .produkt:hover {
                border-color: var(--line-strong);
                background-color: #fafbfd;
            }

            .produkt:active {
                transform: scale(0.99);
                background-color: var(--surface-muted);
            }

            .produkt-links {
                display: flex;
                align-items: center;
                gap: 12px;
                min-width: 0;
            }

            .produkt-bild {
                width: 44px;
                height: 44px;
                object-fit: contain;
                background-color: var(--surface-app);
                border-radius: 8px;
                padding: 4px;
                flex-shrink: 0;
                pointer-events: none;
            }

            .produkt-inhalt {
                display: flex;
                flex-direction: column;
                gap: 2px;
                min-width: 0;
            }

            .produkt-name {
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 16px;
                font-weight: 700;
                color: var(--ink-primary);
            }

            .produkt-pfandhinweis {
                font-size: 11px;
                color: var(--ink-muted);
            }

            .preis {
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 16px;
                font-weight: 700;
                color: var(--ink-primary);
                background-color: var(--surface-muted);
                padding: 6px 10px;
                border-radius: 7px;
                white-space: nowrap;
            }

            .minus-button {
                min-width: 64px;
                padding: 0 12px;
                background-color: var(--surface-card);
                border: 1px solid #fecaca;
                border-radius: 10px;
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 15px;
                font-weight: 700;
                color: var(--accent-danger);
                cursor: pointer;
                transition: background-color 0.12s ease, border-color 0.12s ease, transform 0.06s ease;
            }

            .minus-button:hover {
                background-color: var(--accent-danger-soft);
                border-color: var(--accent-danger);
            }

            .minus-button:active {
                transform: scale(0.97);
            }

            /* BON / WARENKORB */
            .warenkorb {
                margin-top: 18px;
                background-color: var(--surface-card);
                border: 1px solid var(--line-subtle);
                border-radius: 10px;
                padding: 14px 16px;
            }

            .warenkorb-kopf {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding-bottom: 10px;
                border-bottom: 1px solid var(--line-subtle);
            }

            .warenkorb-kopf h2 {
                margin: 0;
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 15px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--ink-secondary);
            }

            .warenkorb-zeile {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 9px 0;
                border-bottom: 1px solid var(--surface-muted);
                font-size: 15px;
            }

            .warenkorb-zeile:last-child {
                border-bottom: none;
            }

            .warenkorb-produkt {
                color: var(--ink-primary);
                font-weight: 500;
            }

            .warenkorb-preis {
                font-weight: 700;
                color: var(--ink-primary);
            }

            .leer {
                margin: 0;
                padding: 20px 8px;
                text-align: center;
                color: var(--ink-muted);
                font-size: 14px;
            }

            .gesamt {
                margin-top: 12px;
                padding-top: 12px;
                border-top: 1px solid var(--line-strong);
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 22px;
                font-weight: 800;
                color: var(--ink-primary);
            }

            .aktions-buttons {
                display: grid;
                grid-template-columns: 1fr 1.6fr;
                gap: 8px;
                margin-top: 14px;
            }

            .loeschen,
            .bezahlen {
                width: 100%;
                padding: 13px 12px;
                border-radius: 8px;
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 15px;
                font-weight: 700;
                cursor: pointer;
                transition: background-color 0.12s ease, border-color 0.12s ease, transform 0.06s ease;
            }

            .loeschen {
                background-color: var(--surface-card);
                border: 1px solid var(--line-strong);
                color: var(--ink-secondary);
            }

            .loeschen:hover:not(:disabled) {
                background-color: var(--accent-danger-soft);
                border-color: #fca5a5;
                color: var(--accent-danger);
            }

            .bezahlen {
                background-color: var(--accent-action);
                border: 1px solid var(--accent-action);
                color: #ffffff;
            }

            .bezahlen:hover:not(:disabled) {
                background-color: var(--accent-action-hover);
            }

            .loeschen:active:not(:disabled),
            .bezahlen:active:not(:disabled) {
                transform: scale(0.985);
            }

            .loeschen:disabled,
            .bezahlen:disabled {
                background-color: var(--surface-muted);
                border-color: var(--line-subtle);
                color: #94a3b8;
                cursor: not-allowed;
            }

            /* MOBILE BOTTOM BAR */
            .mobile-warenkorb {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 25;
                background-color: var(--surface-card);
                border-top: 1px solid var(--line-strong);
                padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
                display: grid;
                gap: 8px;
            }

            .mobile-gesamt {
                margin: 0;
                padding: 0;
                border: none;
                font-size: 20px;
            }

            .mobile-aktions-buttons {
                display: grid;
                grid-template-columns: 1fr 1.6fr;
                gap: 8px;
            }

            /* FOOTER */
            .footer {
                padding: 22px 16px 14px;
                text-align: center;
                font-size: 12px;
                color: var(--ink-muted);
            }

            /* OVERLAY / MODAL */
            .modal-backdrop {
                position: fixed;
                inset: 0;
                z-index: 100;
                background-color: rgba(15, 23, 42, 0.58);
                display: none;
                align-items: center;
                justify-content: center;
                padding: 14px;
            }

            .modal-backdrop.aktiv {
                display: flex;
            }

            .modal-box {
                width: 100%;
                max-width: 430px;
                background-color: var(--surface-card);
                border: 1px solid var(--line-subtle);
                border-radius: 12px;
                overflow: hidden;
            }

            .modal-header {
                background-color: var(--accent-brand);
                color: #ffffff;
                padding: 13px 16px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .modal-header h3 {
                margin: 0;
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 17px;
                font-weight: 700;
            }

            .modal-close {
                width: 30px;
                height: 30px;
                border-radius: 6px;
                border: 1px solid rgba(255, 255, 255, 0.2);
                background-color: rgba(255, 255, 255, 0.08);
                color: #ffffff;
                font-size: 18px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .modal-body {
                padding: 16px;
            }

            .betrag-karte {
                background-color: var(--surface-app);
                border: 1px solid var(--line-subtle);
                border-radius: 8px;
                padding: 11px 14px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 14px;
            }

            .betrag-label {
                font-size: 12px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--ink-secondary);
            }

            .betrag-wert {
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 26px;
                font-weight: 800;
                color: var(--ink-primary);
            }

            .eingabe-gruppe {
                margin-bottom: 10px;
            }

            .eingabe-label {
                display: block;
                font-size: 12px;
                font-weight: 600;
                color: var(--ink-secondary);
                margin-bottom: 5px;
            }

            .eingabe-zeile {
                display: flex;
                gap: 8px;
            }

            .gegeben-input-wrapper {
                position: relative;
                flex: 1;
            }

            .gegeben-input {
                width: 100%;
                padding: 11px 32px 11px 12px;
                border: 1px solid var(--line-strong);
                border-radius: 8px;
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 21px;
                font-weight: 700;
                text-align: right;
                color: var(--ink-primary);
            }

            .gegeben-input:focus {
                outline: none;
                border-color: var(--accent-brand);
            }

            .euro-suffix {
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 16px;
                font-weight: 700;
                color: var(--ink-muted);
                pointer-events: none;
            }

            .clear-input-btn {
                padding: 0 14px;
                border: 1px solid var(--line-strong);
                border-radius: 8px;
                background-color: var(--surface-muted);
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 15px;
                font-weight: 700;
                color: var(--ink-primary);
                cursor: pointer;
            }

            .schnell-betraege {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
                margin-bottom: 14px;
            }

            .schnell-btn {
                padding: 10px 8px;
                border: 1px solid var(--line-subtle);
                border-radius: 8px;
                background-color: var(--surface-card);
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 15px;
                font-weight: 700;
                color: var(--ink-primary);
                cursor: pointer;
            }

            .schnell-btn:hover {
                background-color: var(--surface-app);
                border-color: var(--line-strong);
            }

            .schnell-btn.passend {
                grid-column: span 2;
                background-color: var(--surface-muted);
                border-color: var(--line-strong);
                color: var(--ink-primary);
            }

            .rueckgeld-box {
                border-radius: 8px;
                padding: 12px;
                text-align: center;
                margin-bottom: 14px;
                background-color: var(--surface-app);
                border: 1px solid var(--line-subtle);
            }

            .rueckgeld-box.bereit {
                background-color: var(--accent-action-soft);
                border-color: #86efac;
            }

            .rueckgeld-box.zu-wenig {
                background-color: var(--accent-danger-soft);
                border-color: #fca5a5;
            }

            .rueckgeld-titel {
                display: block;
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--ink-secondary);
                margin-bottom: 3px;
            }

            .rueckgeld-box.bereit .rueckgeld-titel {
                color: var(--accent-action);
            }

            .rueckgeld-box.zu-wenig .rueckgeld-titel {
                color: var(--accent-danger);
            }

            .rueckgeld-summe {
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 30px;
                font-weight: 800;
                color: var(--ink-primary);
            }

            .rueckgeld-box.bereit .rueckgeld-summe {
                color: var(--accent-action);
            }

            .rueckgeld-box.zu-wenig .rueckgeld-summe {
                color: var(--accent-danger);
            }

            .modal-aktionen {
                display: grid;
                grid-template-columns: 1fr 1.6fr;
                gap: 8px;
            }

            .modal-abbrechen {
                padding: 13px 10px;
                border: 1px solid var(--line-strong);
                border-radius: 8px;
                background-color: var(--surface-card);
                color: var(--ink-primary);
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 15px;
                font-weight: 700;
                cursor: pointer;
            }

            .modal-abschliessen {
                padding: 13px 10px;
                border: 1px solid var(--accent-action);
                border-radius: 8px;
                background-color: var(--accent-action);
                color: #ffffff;
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 15px;
                font-weight: 700;
                cursor: pointer;
            }

            .modal-abschliessen:disabled {
                background-color: var(--surface-muted);
                border-color: var(--line-subtle);
                color: #94a3b8;
                cursor: not-allowed;
            }

            /* TABLET (GALAXY TAB S10 FE+ & BREITER) */
            @media (min-width: 768px) {
                body {
                    padding-bottom: 20px;
                }

                .pos-shell {
                    display: grid;
                    grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr);
                    gap: 18px;
                    align-items: start;
                    padding: 18px 18px 0;
                }

                .produkte {
                    grid-template-columns: repeat(2, 1fr);
                    gap: 10px;
                }

                .warenkorb {
                    margin-top: 0;
                    position: sticky;
                    top: 16px;
                }

                .mobile-warenkorb {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <header class="topbar">
            <div class="topbar-brand">
                <img
                    src="Logo1zu1.png"
                    alt="Messdiener Logo"
                    class="logo"
                    width="180"

                    loading="eager"
                    decoding="async"

            </div>
            <span class="topbar-pill">Bar-Kasse</span>
        </header>

                            - 0
                        </button>
                    </div>

                    <!-- KAKAO MIT SCHUSS -->
                    <div class="produkt-container">
                        <button type="button" class="produkt" onclick="Hinzufuegen('Kakao-Schuss')">
                            <span class="produkt-links">
                                <img
                                    class="produkt-bild"
                                    src="kakao-schuss.png"
                                    alt=""
                                    width="240"
                                    height="240"
                                    loading="eager"
                                    decoding="async"
                                />
                                <span class="produkt-inhalt">
                                    <span class="produkt-name">Kakao mit Schuss</span>
                                    <span class="produkt-pfandhinweis">inkl. 2,00 € Pfand</span>

                        <button

                    <!-- KINDERPUNSCH -->
                    <div class="produkt-container">
                        <button type="button" class="produkt" onclick="Hinzufuegen('Kinderpunsch')">
                            <span class="produkt-links">
                                <img
                                    class="produkt-bild"
                                    src="kinderpunsch.png"
                                    alt=""
                                    width="240"
                                    height="240"
                                    loading="eager"
                                    decoding="async"
                                />
                                <span class="produkt-inhalt">
                                    <span class="produkt-name">Kinderpunsch</span>
                                    <span class="produkt-pfandhinweis">inkl. 2,00 € Pfand</span>
                                </span>
                            </span>
                            <span class="preis">2,00 €</span>
                        </button>
                        <button
                            type="button"
                            id="minus-Kinderpunsch"
                            class="minus-button"
                            onclick="entfernen('Kinderpunsch')"
                            style="display: none"
                        >
                            - 0
                        </button>
                    </div>

                    <!-- PFANDRÜCKGABE -->
                    <div class="produkt-container">
                        <button type="button" class="produkt" onclick="Hinzufuegen('Pfandrückgabe')">
                            <span class="produkt-links">
                                <img
                                    class="produkt-bild"
                                    src="pfand.png"
                                    alt=""
                                    width="240"
                                    height="240"
                                    loading="eager"
                                    decoding="async"
                                />
                                <span class="produkt-inhalt">
                                    <span class="produkt-name">Pfandrückgabe</span>
                                    <span class="produkt-pfandhinweis">Gutschrift je Becher</span>
                                </span>
                            </span>
                            <span class="preis">-2,00 €</span>
                        </button>
                        <button
                            type="button"
                            id="minus-Pfandrückgabe"
                            class="minus-button"
                            onclick="entfernen('Pfandrückgabe')"
                            style="display: none"
                        >
                            - 0
                        </button>
                    </div>
                </div>
            </section>

            <aside class="warenkorb" aria-label="Bon">
                <div class="warenkorb-kopf">
                    <h2>Aktueller Bon</h2>
                    <span class="section-sub">EUR</span>
                </div>
                <div id="warenkorb">
                    <p class="leer">Keine Positionen erfasst.</p>
                </div>
                <div class="gesamt" id="gesamt">
                    <span>Gesamt</span>
                    <span>0,00 €</span>
                </div>
                <div class="aktions-buttons">
                    <button type="button" id="loeschen-button" class="loeschen" onclick="loeschen()" disabled>
                        Verwerfen
                    </button>
                    <button type="button" id="bezahlen-button" class="bezahlen" onclick="bezahlen()" disabled>
                        Kassieren
                    </button>
                </div>
            </aside>
        </main>

        <div class="mobile-warenkorb" aria-label="Schnellkasse">
            <div class="gesamt mobile-gesamt" id="mobile-gesamt">
                <span>Gesamt</span>
                <span>0,00 €</span>
            </div>
            <div class="mobile-aktions-buttons">
                <button type="button" id="mobile-loeschen-button" class="loeschen" onclick="loeschen()" disabled>
                    Verwerfen
                </button>
                <button type="button" id="mobile-bezahlen-button" class="bezahlen" onclick="bezahlen()" disabled>
                    Kassieren
                </button>
            </div>
        </div>

        <!-- RÜCKGELD-OVERLAY -->
        <div id="bezahl-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-titel">
            <div class="modal-box">
                <div class="modal-header">
                    <h3 id="modal-titel">Barzahlung</h3>
                    <button type="button" class="modal-close" onclick="schliesseBezahlModal()" aria-label="Schließen">
                        &times;
                    </button>
                </div>

                <div class="modal-body">
                    <div class="betrag-karte">
                        <span class="betrag-label" id="modal-betrag-label">Zu zahlen</span>
                        <span class="betrag-wert" id="modal-gesamt-wert">0,00 €</span>
                    </div>

                    <div id="bar-eingabe-bereich">
                        <div class="eingabe-gruppe">
                            <label class="eingabe-label" for="gegeben-input">Gegeben</label>
                            <div class="eingabe-zeile">
                                <div class="gegeben-input-wrapper">
                                    <input
                                        id="gegeben-input"
                                        class="gegeben-input"
                                        type="text"
                                        inputmode="decimal"
                                        placeholder="0,00"
                                        oninput="verarbeiteDirekteingabe()"
                                    />
                                    <span class="euro-suffix">€</span>
                                </div>
                                <button
                                    type="button"
                                    class="clear-input-btn"
                                    onclick="setzeGegeben(0)"
                                    title="Eingabe löschen"
                                >
                                    C
                                </button>
                            </div>
                        </div>

                        <div class="schnell-betraege">
                            <button type="button" class="schnell-btn passend" onclick="setzePassend()">Passend</button>
                            <button type="button" class="schnell-btn" onclick="addiereBetrag(5)">+ 5 €</button>
                            <button type="button" class="schnell-btn" onclick="addiereBetrag(10)">+ 10 €</button>
                            <button type="button" class="schnell-btn" onclick="addiereBetrag(20)">+ 20 €</button>
                            <button type="button" class="schnell-btn" onclick="addiereBetrag(50)">+ 50 €</button>
                        </div>
                    </div>

                    <div id="rueckgeld-box" class="rueckgeld-box">
                        <span id="rueckgeld-titel" class="rueckgeld-titel">Rückgeld</span>
                        <div id="rueckgeld-summe" class="rueckgeld-summe">0,00 €</div>
                    </div>

                    <div class="modal-aktionen">
                        <button type="button" class="modal-abbrechen" onclick="schliesseBezahlModal()">
                            Abbrechen
                        </button>
                        <button
                            type="button"
                            id="modal-abschliessen-btn"
                            class="modal-abschliessen"
                            onclick="bestellungAbschliessen()"
                            disabled
                        >
                            Abschließen
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer">
            AVANTI MINISTRARE • Messdiener Lembeck • 2026
        </footer>

        <script>
            const produktPreise = {
                Glühwein: 3.5,
                "Glühwein-Schuss": 4.0,
                Kakao: 2.5,
                "Kakao-Schuss": 4.0,
                Kinderpunsch: 2.0,
                Pfandrückgabe: -2.0,
            };
            let bestellungen = {};
            let aktuellerGesamtbetrag = 0;
            let gegebenerBetrag = 0;
            const pfand = 2.0;

            function formatiereEuro(betrag) {
                return betrag.toFixed(2).replace(".", ",") + " €";
            }

            function setzeGesamtAnzeige(betrag) {
                const formatiert = formatiereEuro(betrag);
                const desktopGesamt = document.getElementById("gesamt");
                const mobileGesamt = document.getElementById("mobile-gesamt");

                if (desktopGesamt) {
                    desktopGesamt.innerHTML = `<span>Gesamt</span><span>${formatiert}</span>`;
                }
                if (mobileGesamt) {
                    mobileGesamt.innerHTML = `<span>Gesamt</span><span>${formatiert}</span>`;
                }
            }

            function Hinzufuegen(id) {
                if (!bestellungen[id]) {
                    bestellungen[id] = 0;
                }
                bestellungen[id]++;
                aktualisiereWarenkorb();
            }

            function entfernen(id) {
                if (!bestellungen[id]) {
                    return;
                }
                bestellungen[id]--;
                if (bestellungen[id] === 0) {
                    delete bestellungen[id];
                }
                aktualisiereWarenkorb();
            }

            function loeschen() {
                if (Object.keys(bestellungen).length === 0) {
                    return;
                }
                const bestaetigt = confirm("Möchtest du die Bestellung wirklich löschen?");
                if (!bestaetigt) {
                    return;
                }
                bestellungen = {};
                aktualisiereWarenkorb();
            }

            function aktualisiereWarenkorb() {
                const warenkorb = document.getElementById("warenkorb");
                const loeschenButtons = document.querySelectorAll(".loeschen");
                const bezahlenButtons = document.querySelectorAll(".bezahlen");

                const hatBestellungen = Object.keys(bestellungen).length > 0;
                loeschenButtons.forEach((button) => (button.disabled = !hatBestellungen));
                bezahlenButtons.forEach((button) => (button.disabled = !hatBestellungen));

                warenkorb.innerHTML = "";
                let getraenkeGesamt = 0;
                let anzahlGetraenke = 0;

                for (const id in bestellungen) {
                    const anzahl = bestellungen[id];
                    const einzelpreis = produktPreise[id];
                    const produktGesamt = einzelpreis * anzahl;

                    getraenkeGesamt += produktGesamt;
                    if (id !== "Pfandrückgabe") {
                        anzahlGetraenke += anzahl;
                    }

                    const zeile = document.createElement("div");
                    zeile.className = "warenkorb-zeile";
                    zeile.innerHTML = `
                        <span class="warenkorb-produkt">${id} × ${anzahl}</span>
                        <span class="warenkorb-preis">${formatiereEuro(produktGesamt)}</span>
                    `;
                    warenkorb.appendChild(zeile);

                    const minusButton = document.getElementById(`minus-${id}`);
                    if (minusButton) {
                        minusButton.style.display = "block";
                        minusButton.innerText = "− " + anzahl;
                    }
                }

                for (const id in produktPreise) {
                    if (!bestellungen[id]) {
                        const minusButton = document.getElementById(`minus-${id}`);
                        if (minusButton) {
                            minusButton.style.display = "none";
                        }
                    }
                }

                if (!hatBestellungen) {
                    aktuellerGesamtbetrag = 0;
                    warenkorb.innerHTML = "<p class='leer'>Keine Positionen erfasst.</p>";
                    setzeGesamtAnzeige(0);
                    return;
                }

                const pfandGesamt = anzahlGetraenke * pfand;
                if (anzahlGetraenke > 0) {
                    const pfandZeile = document.createElement("div");
                    pfandZeile.className = "warenkorb-zeile";
                    pfandZeile.innerHTML = `
                        <span class="warenkorb-produkt">Pfand × ${anzahlGetraenke}</span>
                        <span class="warenkorb-preis">${formatiereEuro(pfandGesamt)}</span>
                    `;
                    warenkorb.appendChild(pfandZeile);
                }

                aktuellerGesamtbetrag = Math.round((getraenkeGesamt + pfandGesamt) * 100) / 100;
                setzeGesamtAnzeige(aktuellerGesamtbetrag);
            }

            function bezahlen() {
                if (Object.keys(bestellungen).length === 0) {
                    return;
                }

                const modal = document.getElementById("bezahl-modal");
                const betragLabel = document.getElementById("modal-betrag-label");
                const gesamtWert = document.getElementById("modal-gesamt-wert");
                const eingabeBereich = document.getElementById("bar-eingabe-bereich");

                if (aktuellerGesamtbetrag < 0) {
                    betragLabel.innerText = "Auszahlung an Gast";
                    gesamtWert.innerText = formatiereEuro(Math.abs(aktuellerGesamtbetrag));
                    eingabeBereich.style.display = "none";
                } else {
                    betragLabel.innerText = "Zu zahlen";
                    gesamtWert.innerText = formatiereEuro(aktuellerGesamtbetrag);
                    eingabeBereich.style.display = "block";
                }

                setzeGegeben(0);
                modal.classList.add("aktiv");
            }

            function schliesseBezahlModal() {
                document.getElementById("bezahl-modal").classList.remove("aktiv");
            }

            function setzeGegeben(wert) {
                gegebenerBetrag = Math.max(0, Math.round(wert * 100) / 100);
                const input = document.getElementById("gegeben-input");
                input.value = gegebenerBetrag > 0 ? gegebenerBetrag.toFixed(2).replace(".", ",") : "";
                berechneRueckgeld();
            }

            function addiereBetrag(zusatz) {
                setzeGegeben(gegebenerBetrag + zusatz);
            }

            function setzePassend() {
                setzeGegeben(Math.max(0, aktuellerGesamtbetrag));
            }

            function verarbeiteDirekteingabe() {
                const input = document.getElementById("gegeben-input");
                const bereinigt = input.value.replace(",", ".").replace(/[^0-9.]/g, "");
                const zahl = parseFloat(bereinigt);
                gegebenerBetrag = isNaN(zahl) ? 0 : Math.round(zahl * 100) / 100;
                berechneRueckgeld();
            }

            function berechneRueckgeld() {
                const box = document.getElementById("rueckgeld-box");
                const titel = document.getElementById("rueckgeld-titel");
                const summe = document.getElementById("rueckgeld-summe");
                const abschliessenBtn = document.getElementById("modal-abschliessen-btn");

                box.classList.remove("bereit", "zu-wenig");

                if (aktuellerGesamtbetrag <= 0) {
                    const auszahlung = Math.abs(aktuellerGesamtbetrag);
                    box.classList.add("bereit");
                    titel.innerText = "Pfand auszahlen";
                    summe.innerText = formatiereEuro(auszahlung);
                    abschliessenBtn.disabled = false;
                    return;
                }

                const differenz = Math.round((gegebenerBetrag - aktuellerGesamtbetrag) * 100) / 100;

                if (gegebenerBetrag === 0) {
                    titel.innerText = "Rückgeld";
                    summe.innerText = "0,00 €";
                    abschliessenBtn.disabled = true;
                } else if (differenz < 0) {
                    box.classList.add("zu-wenig");
                    titel.innerText = "Es fehlen noch";
                    summe.innerText = formatiereEuro(Math.abs(differenz));
                    abschliessenBtn.disabled = true;
                } else {
                    box.classList.add("bereit");
                    titel.innerText = "Rückgeld";
                    summe.innerText = formatiereEuro(differenz);
                    abschliessenBtn.disabled = false;
                }
            }

            function bestellungAbschliessen() {
                bestellungen = {};
                aktualisiereWarenkorb();
                schliesseBezahlModal();
            }

            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape") {
                    schliesseBezahlModal();
                }
            });
        </script>
    </body>
</html>
